<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey Begins Soon</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
        }

        .text {
            color: #fff;
            font-size: 3rem;
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeInCinematic 6s ease forwards;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        @keyframes fadeInCinematic {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }
            40% {
                opacity: 0.3;
                transform: translateY(10px);
                filter: blur(6px);
            }
            70% {
                opacity: 0.7;
                transform: translateY(0);
                filter: blur(3px);
            }
            100% {
                opacity: 1;
                filter: blur(0);
            }
        }
    </style>
</head>
<body>
    <div class="text">The journey begins soon.</div>
</body>
</html>
